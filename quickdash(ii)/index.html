<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Quick Dash: Garden Tag Arena - 2D arcade survival tag game">
  <title>Quick Dash: Tag Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Main Render Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- TOP HUD: Clean, Responsive, High Readability -->
    <header id="hud">
      <!-- Left: Lives, HP Bar & Dash Cooldown -->
      <div class="hud-panel hud-left-panel">
        <div id="lives-display" class="lives-group" aria-label="Player Lives">
          <span class="heart full">♥</span>
          <span class="heart full">♥</span>
          <span class="heart full">♥</span>
        </div>

        <div id="score-display-wrapper" class="score-display-wrapper" aria-label="Survival Score">
          <span class="score-label">SCORE</span>
          <span id="score-text" class="score-value">10,000</span>
        </div>

        <div id="dash-indicator" class="dash-indicator ready" aria-label="Dash Cooldown">
          <span class="dash-label">⚡ DASH</span>
          <div class="dash-track">
            <div id="dash-fill" class="dash-fill" style="width: 100%;"></div>
          </div>
        </div>

        <!-- Shield Status Indicator (Active when holding shield) -->
        <div id="shield-indicator" class="shield-indicator" aria-label="Shield Active" style="display: none;">
          <span class="shield-badge">🛡 SHIELD</span>
        </div>
      </div>

      <!-- Center: 60-Second Countdown Timer -->
      <div class="hud-panel hud-center-panel">
        <span class="timer-label">TIME</span>
        <span id="timer-display" class="timer-value">60</span>
      </div>

      <!-- Right: Minimal Pause -->
      <div class="hud-right">
        <button id="btn-pause-hud" class="btn-icon" aria-label="Pause Game">⏸</button>
      </div>
    </header>

    <!-- MOBILE TOUCH CONTROLS (Ergonomic thumb layout) -->
    <div id="mobile-controls">
      <!-- Movement Left / Right -->
      <div class="touch-cluster-left">
        <button id="touch-left" class="touch-btn" aria-label="Move Left">◀</button>
        <button id="touch-right" class="touch-btn" aria-label="Move Right">▶</button>
      </div>

      <!-- Action Cluster: Dash (Escape) & Jump (Double-Jump) -->
      <div class="touch-cluster-right">
        <button id="touch-dash" class="touch-btn dash-btn" aria-label="Dash (Invulnerable Escape)">
          ⚡
          <span class="subtext">Dash</span>
        </button>
        <button id="touch-jump" class="touch-btn jump-btn" aria-label="Jump / Double Jump">
          ▲
          <span class="subtext">Jump</span>
        </button>
      </div>
    </div>

    <!-- START INSTRUCTION OVERLAY (Non-button prompt: Press Any Key / Tap Anywhere) -->
    <div id="start-prompt-overlay" class="start-instruction-overlay">
      <div class="start-prompt-text desktop-instruction">PRESS ANY KEY TO PLAY</div>
      <div class="start-prompt-text mobile-instruction">TAP ANYWHERE TO PLAY</div>
    </div>

    <!-- PAUSE MODAL -->
    <div id="pause-modal" class="overlay-screen" style="display: none;">
      <div class="menu-card">
        <h2 class="modal-title">GAME PAUSED</h2>
        <div class="menu-button-group">
          <button id="btn-resume" class="btn-arcade primary">▶ RESUME</button>
          <button id="btn-restart-pause" class="btn-arcade secondary">🔄 RESTART</button>
        </div>
      </div>
    </div>

    <!-- GAME OVER / ROUND COMPLETE SCREEN -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
      <div class="menu-card">
        <h2 id="result-title" class="game-title" style="color: #ef4444; font-size: 2.2rem;">GAME OVER</h2>
        <p id="result-subtitle" class="game-subtitle">Out of Lives!</p>

        <div class="stats-summary">
          <div class="stat-box">
            <span class="label">Time Survived</span>
            <span id="final-survival-time" class="val">0s</span>
          </div>
          <div class="stat-box">
            <span class="label">Final Score</span>
            <span id="final-score" class="val">0</span>
          </div>
          <div class="stat-box">
            <span class="label">High Score</span>
            <span id="final-highscore" class="val">0</span>
          </div>
        </div>

        <div class="menu-button-group">
          <button id="btn-restart-gameover" class="btn-arcade primary">🔄 PLAY AGAIN</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/map.js"></script>
  <script src="js/entities/shield.js"></script>
  <script src="js/entities/projectile.js"></script>
  <script src="js/entities/ghost.js"></script>
  <script src="js/entities/player.js"></script>
  <script src="js/entities/bots.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
